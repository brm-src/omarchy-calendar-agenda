<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Calendar Agenda for Omarchy</title>
  <desc id="desc">A theme-aware Omarchy bar widget with day, week, and month views and grouped calendar events.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151d"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0228f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6736b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#desk)"/>
  <circle cx="180" cy="180" r="420" fill="url(#glow)"/>
  <path d="M0 760 C350 620 530 860 840 720 S1330 560 1600 730 V1000 H0Z" fill="#111318" opacity=".75"/>
  <rect width="1600" height="64" fill="#0b0c0f" opacity=".96"/>
  <text x="42" y="40" fill="#f3f0f2" font-family="Inter, sans-serif" font-size="22" font-weight="700">omarchy</text>
  <g fill="#aaa5ac" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">
    <text x="1280" y="40">󰋀</text><text x="1330" y="40">󰂯</text><text x="1380" y="40">󰖩</text><text x="1430" y="40">󰕾</text><text x="1480" y="40">󰃭</text><text x="1530" y="40">19:00</text>
  </g>

  <rect x="1010" y="88" width="520" height="790" rx="20" fill="#17161e" stroke="#e0228f" stroke-opacity=".72" filter="url(#shadow)"/>
  <text x="1050" y="136" fill="#e0228f" font-family="Inter, sans-serif" font-size="18" font-weight="800" letter-spacing="4">AGENDA</text>
  <text x="1050" y="161" fill="#aaa5ac" font-family="Inter, sans-serif" font-size="15">3 eventos en la vista</text>
  <text x="1440" y="139" fill="#f3f0f2" font-family="Inter, sans-serif" font-size="22">↻</text><text x="1480" y="139" fill="#f3f0f2" font-family="Inter, sans-serif" font-size="24">×</text>
  <line x1="1050" y1="180" x2="1490" y2="180" stroke="#e0228f" stroke-opacity=".45"/>

  <g font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="1050" y="202" width="140" height="38" rx="9" fill="#f3f0f2" fill-opacity=".07"/><text x="1120" y="226" fill="#aaa5ac">DÍA</text>
    <rect x="1200" y="202" width="140" height="38" rx="9" fill="#e0228f" fill-opacity=".24"/><text x="1270" y="226" fill="#e0228f">SEMANA</text>
    <rect x="1350" y="202" width="140" height="38" rx="9" fill="#f3f0f2" fill-opacity=".07"/><text x="1420" y="226" fill="#aaa5ac">MES</text>
  </g>

  <text x="1070" y="284" fill="#f3f0f2" font-family="Inter, sans-serif" font-size="24">‹</text>
  <text x="1270" y="284" fill="#f3f0f2" font-family="Inter, sans-serif" font-size="17" font-weight="700" text-anchor="middle">LUN AGO 24 – DOM AGO 30</text>
  <text x="1470" y="284" fill="#f3f0f2" font-family="Inter, sans-serif" font-size="24">›</text>
  <rect x="1050" y="303" width="66" height="30" rx="8" fill="#e0228f" fill-opacity=".18"/><text x="1083" y="323" fill="#e0228f" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HOY</text>
  <text x="1130" y="323" fill="#817b86" font-family="Inter, sans-serif" font-size="13">Actualizado 19:00 · Trabajo</text>

  <text x="1050" y="377" fill="#e0228f" font-family="Inter, sans-serif" font-size="14" font-weight="800" letter-spacing="2">LUN AGO 24</text>
  <g font-family="Inter, sans-serif">
    <rect x="1050" y="394" width="440" height="68" rx="10" fill="#f3f0f2" fill-opacity=".07"/>
    <text x="1066" y="422" fill="#817b86" font-size="14">09:00</text><text x="1142" y="422" fill="#f3f0f2" font-size="16" font-weight="700">Reunión de coordinación</text><text x="1142" y="446" fill="#817b86" font-size="13">Trabajo · Sala 2</text>
  </g>
  <text x="1050" y="505" fill="#e0228f" font-family="Inter, sans-serif" font-size="14" font-weight="800" letter-spacing="2">MAR AGO 25</text>
  <g font-family="Inter, sans-serif">
    <rect x="1050" y="522" width="440" height="68" rx="10" fill="#f3f0f2" fill-opacity=".07"/>
    <text x="1066" y="550" fill="#817b86" font-size="14">16:45</text><text x="1142" y="550" fill="#f3f0f2" font-size="16" font-weight="700">Seguimiento de proyecto</text><text x="1142" y="574" fill="#817b86" font-size="13">Trabajo · Meet</text>
  </g>
  <text x="1050" y="633" fill="#e0228f" font-family="Inter, sans-serif" font-size="14" font-weight="800" letter-spacing="2">JUE AGO 28</text>
  <g font-family="Inter, sans-serif">
    <rect x="1050" y="650" width="440" height="68" rx="10" fill="#f3f0f2" fill-opacity=".07"/>
    <text x="1066" y="678" fill="#e0228f" font-size="14" font-weight="800">TODO EL DÍA</text><text x="1160" y="678" fill="#f3f0f2" font-size="16" font-weight="700">Planificación trimestral</text><text x="1160" y="702" fill="#817b86" font-size="13">Personal</text>
  </g>
  <text x="1050" y="800" fill="#817b86" font-family="Inter, sans-serif" font-size="13">D / W / M cambiar vista · R actualizar</text>
</svg>
